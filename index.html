<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Arcade | Jogos Online Grátis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding-bottom: 60px;
        }

        /* Barra de Topo Premium */
        header {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #312e81;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 26px;
            font-weight: 900;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 500;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Título das Categorias */
        .categoria-titulo {
            font-size: 18px;
            font-weight: 700;
            margin: 25px 0 15px 0;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categoria-titulo::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: #38bdf8;
            border-radius: 2px;
        }

        /* Grade de Jogos Estilo Loja */
        .jogos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Quando abrir no PC mostra 3 colunas */
        @media (min-width: 600px) {
            .jogos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Cartão do Jogo */
        .jogo-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* Efeito de clique no celular */
        .jogo-card:active {
            transform: scale(0.96);
            border-color: #38bdf8;
        }

        /* Container da foto para não quebrar o layout */
        .thumb-container {
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background-color: #1f2937;
            position: relative;
        }

        .jogo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* Informações do Jogo */
        .jogo-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .jogo-info h3 {
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-tags {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .categoria-tag {
            font-size: 11px;
            color: #94a3b8;
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Botão Jogar Estilo Neon */
        .btn-jogar {
            font-size: 11px;
            font-weight: 700;
            color: #0b0f19;
            background-color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ NEXUS ARCADE</h1>
        <p>Sua central de jogos mobile instantâneos</p>
    </header>

    <div class="container">
        
        <h2 class="categoria-titulo">Mais Jogados da Semana</h2>
        
        <div class="jogos-grid">

            <a href="https://poki.com.br/g/subway-surfers" target="_blank" class="jogo-card">
                <div class="thumb-container">
                    <img src="https://images.unsplash.com/photo-1551103782-8ab07afd45c1?w=400&q=80" alt="Subway Surfers">
                </div>
                <div class="jogo-info">
                    <h3>Subway Surfers</h3>
                    <div class="meta-tags">
                        <span class="categoria-tag">Corrida</span>
                        <span class="btn-jogar">Jogar</span>
                    </div>
                </div>
            </a>

            <a href="https://classic.minecraft.net" target="_blank" class="jogo-card">
                <div class="thumb-container">
                    <img src="https://images.unsplash.com/photo-1605901309584-818e25960a8f?w=400&q=80" alt="Minecraft">
                </div>
                <div class="jogo-info">
                    <h3>Minecraft</h3>
                    <div class="meta-tags">
                        <span class="categoria-tag">Aventura</span>
                        <span class="btn-jogar">Jogar</span>
                    </div>
                </div>
            </a>

            <a href="https://poki.com.br/g/uno-online" target="_blank" class="jogo-card">
                <div class="thumb-container">
                    <img src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=400&q=80" alt="Uno">
                </div>
                <div class="jogo-info">
                    <h3>Uno Online</h3>
                    <div class="meta-tags">
                        <span class="categoria-tag">Cartas</span>
                        <span class="btn-jogar">Jogar</span>
                    </div>
                </div>
            </a>

            <a href="https://poki.com.br/g/cyber-cars-punk-racing" target="_blank" class="jogo-card">
                <div class="thumb-container">
                    <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&q=80" alt="Cyber Cars">
                </div>
                <div class="jogo-info">
                    <h3>Cyber Cars</h3>
                    <div class="meta-tags">
                        <span class="categoria-tag">Carros</span>
                        <span class="btn-jogar">Jogar</span>
                    </div>
                </div>
            </a>

            <a href="https://poki.com.br/g/temple-run-2" target="_blank" class="jogo-card">
                <div class="thumb-container">
                    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&q=80" alt="Temple Run 2">
                </div>
                <div class="jogo-info">
                    <h3>Temple Run 2</h3>
                    <div class="meta-tags">
                        <span class="categoria-tag">Ação</span>
                        <span class="btn-jogar">Jogar</span>
                    </div>
                </div>
            </a>

            <a href="https://poki.com.br/g/stickman-hook" target="_blank" class="jogo-card">
                <div class="thumb-container">
                    <img src="https://images.unsplash.com/photo-1553481187-be93c21490a9?w=400&q=80" alt="Stickman Hook">
                </div>
                <div class="jogo-info">
                    <h3>Stickman Hook</h3>
                    <div class="meta-tags">
                        <span class="categoria-tag">Habilidade</span>
                        <span class="btn-jogar">Jogar</span>
                    </div>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
